name: Continuous Planner comparison Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source provenance excludes local packaging files
        run: python -m unittest discover -s web/qa -p test_provenance.py
      - name: Verify frozen samples and build site
        run: python web/build.py --output build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
